name: ctv-release
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctv_manage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctv_manage}
      POSTGRES_DB: ctv_manage
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctv_manage -d ctv_manage"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE in .env.docker}/ctv-backend:1.0.1
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4001
      DATABASE_URL: postgresql://ctv_manage:${POSTGRES_PASSWORD:-ctv_manage}@postgres:5432/ctv_manage?schema=public
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      STORAGE_DRIVER: local
      FILE_STORAGE_ROOT: /data/uploads
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-ctv_manage_rate_limit_secret}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - npm run prisma:deploy && npm run start --workspace=app/backend

  frontend:
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE in .env.docker}/ctv-frontend:1.0.0
    restart: unless-stopped
    ports:
      - "${CTV_HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:

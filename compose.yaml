services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctv_manage
      POSTGRES_PASSWORD: ctv_manage
      POSTGRES_DB: ctv_manage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctv_manage -d ctv_manage"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctv_manage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctv_manage}
      POSTGRES_DB: ctv_manage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctv_manage -d ctv_manage"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ctv-backend:latest
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4001
      DATABASE_URL: postgresql://ctv_manage:${POSTGRES_PASSWORD:-ctv_manage}@postgres:5432/ctv_manage?schema=public
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      STORAGE_DRIVER: local
      FILE_STORAGE_ROOT: /data/uploads
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-ctv_manage_rate_limit_secret}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - dist/src/main.js

  frontend:
    image: ctv-frontend:latest
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:

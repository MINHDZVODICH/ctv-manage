name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: CI & Full Acceptance Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ctv_manage
          POSTGRES_PASSWORD: ctv_manage
          POSTGRES_DB: ctv_manage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://ctv_manage:ctv_manage@localhost:5432/ctv_manage_test?schema=public
      DATABASE_TEST_URL: postgresql://ctv_manage:ctv_manage@localhost:5432/ctv_manage_test?schema=public
      STORAGE_DRIVER: local
      FILE_STORAGE_ROOT: .acceptance-uploads
      SESSION_SECRET: ci-acceptance-session-secret-min-32-chars-long
      RATE_LIMIT_KEY_SECRET: ci-acceptance-rate-limit-secret-32-chars-long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Verify frontend architectural import boundaries
        run: npm run check:boundaries --workspace=app/frontend

      - name: Check i18n translations
        run: npm run check:i18n

      - name: Run i18n unit tests
        run: npm run test:i18n

      - name: Run frontend unit tests
        run: npm run test:unit:frontend

      - name: Build applications
        run: npm run build

      - name: Run backend integration tests
        run: npm run test:api
        env:
          STORAGE_DRIVER: local

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Create dedicated E2E test database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U ctv_manage -d ctv_manage_test -c "CREATE DATABASE ctv_manage_e2e_test;"

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          STORAGE_DRIVER: local
          DATABASE_URL: postgresql://ctv_manage:ctv_manage@localhost:5432/ctv_manage_e2e_test?schema=public
          DATABASE_TEST_URL: postgresql://ctv_manage:ctv_manage@localhost:5432/ctv_manage_e2e_test?schema=public

      - name: Upload JUnit XML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            app/backend/test-results/**/*.xml
            app/frontend/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Build and verify release Docker image sizes
        run: |
          docker build -f docker/backend.Dockerfile -t ctv-backend:1.0.1 .
          docker build -f docker/frontend.Dockerfile -t ctv-frontend:1.0.0 .
          npm run check:image-sizes

      - name: Upload Playwright test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            app/frontend/playwright-report/
            app/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  deployment-gate:
    name: Deployment Gate (Blocks Deploy On Failure)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI gate passed
        run: echo "All verification checks passed. Deployment gate approved."

      - name: Trigger deployment webhook (optional)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL" || exit 1
